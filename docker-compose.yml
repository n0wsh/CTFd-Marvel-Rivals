services:
  ctfd:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_started
      cache:
        condition: service_started
    networks:
        default:
        internal:

  # TODO: CTFd 4.0 Migrate to named volumes. Users will likely need to manually migrate existing files
  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
    command: chown -R 1001:1001 /var/uploads /var/log/CTFd

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - 80:80
      - 443:443
    depends_on:
      - ctfd
      - scoreboard

  scoreboard:
    image: node:24-alpine
    restart: always
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_CTFD_PUBLIC_BASE=${NEXT_PUBLIC_CTFD_PUBLIC_BASE:-https://u18-final.haruulzangi.mn}
      - NEXT_PUBLIC_SCOREBOARD_PUBLIC_BASE=${NEXT_PUBLIC_SCOREBOARD_PUBLIC_BASE:-https://scoreboard.haruulzangi.mn}
      - NEXT_PUBLIC_SCOREBOARD_API_BASE=${NEXT_PUBLIC_SCOREBOARD_API_BASE:-https://u18-final.haruulzangi.mn/api/v1/hzu18}
      - CTFD_ADMIN_API_BASE=https://u18-final.haruulzangi.mn/api/v1
      - CTFD_ADMIN_API_KEY=ctfd_989517d3cc7e3601fad292fd682530786cf82114f04718ef713c983a32a642c8
    volumes:
      - ./apps/scoreboard:/app
      - scoreboard_node_modules:/app/node_modules
      - scoreboard_next:/app/.next
    command: >
      sh -lc "corepack enable
      && pnpm install --frozen-lockfile
      && pnpm build
      && pnpm exec next start -H 0.0.0.0 -p 3000"

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
        internal:
    # This command is required to set important mariadb defaults
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:4
    restart: always
    volumes:
    - .data/redis:/data
    networks:
        internal:

networks:
    default:
    internal:
        internal: true

volumes:
    scoreboard_node_modules:
    scoreboard_next:
